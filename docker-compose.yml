services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: roundnet
      POSTGRES_USER: roundnet
      POSTGRES_PASSWORD: roundnet
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roundnet -d roundnet"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - roundnet-postgres:/var/lib/postgresql/data

volumes:
  roundnet-postgres:
